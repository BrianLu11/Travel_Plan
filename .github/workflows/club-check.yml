name: Travel Club backend checks
on:
  pull_request:
    paths:
      - "functions/**"
      - "travel-club/**"
      - "expense-tracker/**"
      - "photo-gallery/**"
      - "firebase.json"
      - ".github/workflows/club-check.yml"
  push:
    branches: [main]
    paths:
      - "functions/**"
      - "travel-club/**"
      - "expense-tracker/**"
      - "photo-gallery/**"
      - "firebase.json"
      - ".github/workflows/club-check.yml"
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"
      - run: npm install --prefix functions --no-audit --no-fund
      - name: Audit production dependencies (moderate or higher)
        run: npm audit --omit=dev --audit-level=moderate --prefix functions
      - run: npm run check --prefix functions
      - run: node --check travel-club/app.js
      - run: node --check expense-tracker/app.js
      - run: node --check photo-gallery/app.js
      - name: Firestore Security Rules emulator tests
        run: npx --yes firebase-tools@latest emulators:exec --project demo-travel-club --only firestore "npm run test:rules --prefix functions"
